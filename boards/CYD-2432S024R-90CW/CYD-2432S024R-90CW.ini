; PlatformIO Configuration for cloned CYD 2.4" (320x240 rectangular) with 90° CW touchscreen rotation

[env:CYD-2432S024R-90CW]
extends = CYD_base
build_src_filter = ${env.build_src_filter} +<../boards/CYD-2432S024R-90CW>
build_flags =
	${CYD_base.build_flags}
	-Iboards/CYD-2432S024R-90CW

	-DTOUCH_CTRL_XPT2046=1
	-DHAS_RESISTIVE_TOUCH=1
	-DTOUCH_ROTATE_90_CW=1
	; Rectangular 2.4" (320x240) pre-swap axis scaling so after 90° CW SwapXY
	; X spans [0..320] and Y spans [0..240] without clipping or overflow
	-DCYD28_DISPLAY_HOR_RES_MAX=240
	-DCYD28_DISPLAY_VER_RES_MAX=320

	; ==================== Library Flags ====================
	-DTFT_BL=21
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-2432S024R-90CW"'
